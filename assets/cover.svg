<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <!-- Swiss / Bauhaus: cream ground, stark black, one crimson accent -->
  <rect width="1240" height="1754" fill="#EFE9DB"/>

  <!-- ── header row ─────────────────────────────────────────── -->
  <text x="130" y="152" font-family="'Menlo','Monaco',monospace" font-size="25" letter-spacing="5" fill="#17140F">LITERATE DRIVEN DEVELOPMENT</text>
  <text x="1110" y="152" text-anchor="end" font-family="'Menlo','Monaco',monospace" font-size="25" letter-spacing="3" fill="#17140F">VOL. 1</text>
  <rect x="130" y="176" width="980" height="3" fill="#17140F"/>

  <!-- ── Bauhaus composition: square · axis · circle ─────────── -->
  <line x1="130" y1="410" x2="1110" y2="410" stroke="#17140F" stroke-width="1.5"/>
  <rect x="130" y="300" width="210" height="210" fill="#17140F"/>
  <text x="235" y="430" text-anchor="middle" font-family="'Menlo','Monaco',monospace" font-size="70" font-weight="700" fill="#EFE9DB">{ }</text>
  <circle cx="1005" cy="405" r="105" fill="#C21E33"/>

  <!-- the pipeline, as an honest labelled flow (no fake asm) -->
  <g font-family="'Menlo','Monaco',monospace" font-size="24" fill="#17140F" letter-spacing="0.5">
    <text x="430" y="350">lex &#183; parse &#183; sema</text>
    <text x="430" y="386">ir &#183; opt &#183; codegen</text>
    <text x="430" y="440">emit &#160;ARM64 &#183; x86-64</text>
  </g>

  <!-- ── hero wordmark ──────────────────────────────────────── -->
  <text x="124" y="820" font-family="'Menlo','Monaco',monospace" font-size="300" font-weight="700" letter-spacing="-25" fill="#17140F">kcc</text>

  <!-- ── title, elegant serif ───────────────────────────────── -->
  <text x="130" y="968" font-family="'Georgia','Times New Roman',serif" font-size="60" fill="#17140F">A Formal C17 Compiler</text>
  <text x="130" y="1040" font-family="'Georgia','Times New Roman',serif" font-size="60" fill="#17140F">in ARM64 Assembly</text>
  <text x="132" y="1112" font-family="'Menlo','Monaco',monospace" font-size="27" fill="#17140F" opacity="0.62">that cross-compiles to x86-64</text>

  <!-- lower geometric marker: crimson square accent + rule -->
  <rect x="130" y="1300" width="46" height="46" fill="#C21E33"/>
  <text x="205" y="1336" font-family="'Georgia','Times New Roman',serif" font-style="italic" font-size="34" fill="#17140F">documentation is the source.</text>

  <!-- ── footer ─────────────────────────────────────────────── -->
  <rect x="130" y="1560" width="980" height="3" fill="#17140F"/>
  <text x="130" y="1616" font-family="'Georgia','Times New Roman',serif" font-size="36" fill="#17140F">Cuauht&#233;moc Pacheco</text>
  <text x="130" y="1658" font-family="'Menlo','Monaco',monospace" font-size="24" letter-spacing="1" fill="#17140F" opacity="0.7">co-authored with an AI &#183; Claude</text>
  <text x="1110" y="1616" text-anchor="end" font-family="'Menlo','Monaco',monospace" font-size="30" font-weight="700" fill="#17140F">kcc {{VERSION}}</text>
</svg>
